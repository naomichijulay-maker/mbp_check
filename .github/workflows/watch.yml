name: refurb-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき（GitHub側の混雑で遅れることがあります）
  workflow_dispatch:         # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: refurb-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check refurbished store
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "refurb-watch"
            git config user.email "refurb-watch@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
